<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Virtual - AC Evo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #00d26a;
      --text-color: #f8fafc;
      --border-color: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #00f078;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #0f172a;
      color: var(--accent-color);
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #334155;
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      display: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .pill {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
      background-color: var(--border-color);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .item-box {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tienda Virtual - Assetto Corsa Evo</h1>

    <div class="card">
      <button onclick="refrescarTodo()">🔄 Actualizar Datos</button>
    </div>

    <div class="card">
      <h2>Pilotos y Saldos</h2>
      <div id="view-pilotos">
        <p>Cargando información de pilotos...</p>
      </div>
    </div>

    <div class="card">
      <h2>Catálogo de Coches</h2>
      <div id="view-tienda" class="grid">
        <p>Cargando catálogo...</p>
      </div>
    </div>

    <div class="card">
      <h2>Historial de Movimientos</h2>
      <div id="view-historial">
        <p>Cargando datos desde Google Sheets...</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // URL de tu API en Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbycFt0lPATWmk7w0U3oGLVztDd4X_aCGXNzoLDNp58k_ckPUxjLRO90_Igy7etJADO7/exec";

    function toast(mensaje) {
      const t = document.getElementById('toast');
      t.innerText = mensaje;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    async function apiCall(action, params = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, params: params })
        });
        return await response.json();
      } catch (error) {
        console.error("Error en la llamada a la API:", error);
        toast('Error de conexión con la API');
        throw error;
      }
    }

    async function cargarEstadoCompleto() {
      try {
        const res = await apiCall("obtenerEstado");
        if (res && res.success) {
          renderPilotos(res.data.pilotos || []);
          renderTienda(res.data.tienda || []);
          renderHistorial(res.data.historial || []);
        } else {
          toast('Error al obtener los datos de Google Sheets');
        }
      } catch (err) {
        console.error("Error en cargarEstadoCompleto:", err);
      }
    }

    function renderPilotos(pilotos) {
      if (!pilotos.length) {
        document.getElementById('view-pilotos').innerHTML = '<p>No hay pilotos registrados.</p>';
        return;
      }
      const rows = pilotos.map(p => `
        <tr>
          <td>${p.Nombre || p.Piloto || ''}</td>
          <td>${Number(p.Saldo || 0).toLocaleString()} €</td>
        </tr>`).join('');

      document.getElementById('view-pilotos').innerHTML = `
        <table>
          <thead><tr><th>Piloto</th><th>Saldo Actual</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderTienda(coches) {
      if (!coches.length) {
        document.getElementById('view-tienda').innerHTML = '<p>No hay coches en el catálogo.</p>';
        return;
      }
      document.getElementById('view-tienda').innerHTML = coches.map(c => `
        <div class="item-box">
          <h3>${c.Nombre || c.Coche || 'Coche'}</h3>
          <p><strong>Categoría:</strong> ${c.Categoria || '-'}</p>
          <p><strong>Precio:</strong> ${Number(c.Precio || 0).toLocaleString()} €</p>
        </div>`).join('');
    }

    function renderHistorial(historial) {
      if (!historial.length) {
        document.getElementById('view-historial').innerHTML = '<p>Sin movimientos todavía</p>';
        return;
      }
      const rows = historial.map(h => `
        <tr>
          <td>${h.Fecha ? new Date(h.Fecha).toLocaleString() : ''}</td>
          <td><span class="pill">${h.Tipo || ''}</span></td>
          <td>${h.Piloto || ''}</td>
          <td>${h.Coche || ''}</td>
          <td>${Number(h.Importe || 0).toLocaleString()} €</td>
        </tr>`).join('');

      document.getElementById('view-historial').innerHTML = `
        <table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Piloto</th><th>Coche</th><th>Importe</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function refrescarTodo() {
      cargarEstadoCompleto();
    }

    window.onload = function() {
      refrescarTodo();
    };
  </script>
</body>
</html>
