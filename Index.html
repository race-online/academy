<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Online Shop - Simracing</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #e11d48;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1, h2 { text-transform: uppercase; letter-spacing: 1px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .price { font-size: 1.25rem; font-weight: bold; color: #10b981; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .select-piloto {
      padding: 8px;
      border-radius: 4px;
      background: #334155;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Concesionario AC Academy</h1>
      <label for="pilotoSelect">Piloto Activo: </label>
      <select id="pilotoSelect" class="select-piloto" onchange="actualizarSaldo()"></select>
    </div>
    <div>
      <div>Saldo disponible:</div>
      <div id="saldoDisplay" class="price">0 EC</div>
    </div>
  </header>

  <h2>Catálogo de Vehículos</h2>
  <div id="catalogo" class="grid">Cargando coches...</div>
</div>

<script>
  // URL actualizada del ejecutable de Google Apps Script
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzzY_coF8I76jbWPgGeURVlwfOUnvciGoVOJ1KJ3uN3W70GuRJQuKBhqMaZoosp0G3BqA/exec';

  let dbData = { pilotos: [], coches: [] };

  async function cargarDatos() {
    try {
      const response = await fetch(WEB_APP_URL);
      const json = await response.json();
      if (!json.ok) throw new Error(json.error);
      
      dbData = json.data;
      poblarPilotos();
      renderCatalogo();
    } catch (err) {
      alert('Error al cargar datos: ' + err.message);
    }
  }

  function poblarPilotos() {
    const select = document.getElementById('pilotoSelect');
    select.innerHTML = '';
    dbData.pilotos.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.ID_Piloto;
      opt.textContent = p.Nombre_Piloto || p.ID_Piloto;
      select.appendChild(opt);
    });
    actualizarSaldo();
  }

  function actualizarSaldo() {
    const idPiloto = document.getElementById('pilotoSelect').value;
    const piloto = dbData.pilotos.find(p => String(p.ID_Piloto) === String(idPiloto));
    if (piloto) {
      document.getElementById('saldoDisplay').textContent = (piloto.Saldo_EC || 0) + ' EC';
    }
  }

  function renderCatalogo() {
    const container = document.getElementById('catalogo');
    container.innerHTML = '';

    dbData.coches.forEach(coche => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const esStock = coche.Stock !== undefined && coche.Stock !== '';
      const stockTexto = esStock ? `Stock: ${coche.Stock}` : (coche.Propietario_ID === 'CONCESIONARIO' ? 'Disponible' : 'Vendido');
      
      card.innerHTML = `
        <div>
          <h3>${coche.Nombre_Coche || coche.ID_Coche}</h3>
          <p>Estado/Stock: ${stockTexto}</p>
          <p class="price">${coche.Precio_Compra_EC} EC</p>
        </div>
        <button onclick="comprar('${coche.ID_Coche}')">Comprar Coche</button>
      `;
      container.appendChild(card);
    });
  }

  async function comprar(idCoche) {
    const idPiloto = document.getElementById('pilotoSelect').value;
    if (!idPiloto) return alert('Selecciona un piloto.');

    const pin = prompt('Introduce tu PIN de seguridad:');
    if (!pin) return;

    try {
      // Petición simple usando text/plain para evitar el preflight CORS en Apps Script
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'comprarCoche',
          idPiloto: idPiloto,
          idCoche: idCoche,
          pin: pin
        })
      });

      const json = await response.json();
      if (!json.ok) throw new Error(json.error);

      alert(json.message);
      cargarDatos(); // Recargar datos para actualizar la UI
    } catch (err) {
      alert('Error en la transacción: ' + err.message);
    }
  }

  // Inicializar al cargar la página
  window.onload = cargarDatos;
</script>

</body>
</html>
