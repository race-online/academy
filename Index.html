<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --border:#2a2f3a;
      --text:#e8eaed; --muted:#9aa1ac; --accent:#ff6b35; --accent2:#3ddc97;
      --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
    header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
    header h1{margin:0;font-size:20px;letter-spacing:.5px;}
    header h1 span{color:var(--accent);}
    .selector{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:8px 12px;border-radius:10px;border:1px solid var(--border);}
    .selector select{background:transparent;color:var(--text);border:none;font-size:14px;}
    .saldo{color:var(--accent2);font-weight:600;}
    nav{display:flex;gap:6px;padding:12px 24px;border-bottom:1px solid var(--border);}
    nav button{background:transparent;border:none;color:var(--muted);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px;}
    nav button.active{background:var(--panel2);color:var(--text);font-weight:600;}
    main{padding:24px;max-width:1100px;margin:0 auto;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;}
    .card:hover{transform:translateY(-2px);border-color:var(--accent);}
    .card .img{height:120px;background:var(--panel2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
    .card .body{padding:12px 14px;}
    .card h3{margin:0 0 4px;font-size:15px;}
    .card p{margin:0;color:var(--muted);font-size:12px;}
    .tag{display:inline-block;background:var(--panel2);color:var(--accent2);font-size:11px;padding:2px 8px;border-radius:20px;margin-top:6px;}
    .price{color:var(--accent);font-weight:700;margin-top:8px;font-size:15px;}
    .btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;width:100%;}
    .btn:disabled{background:#444;cursor:not-allowed;}
    .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
    .btn.sell{background:var(--danger);}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
    th{color:var(--muted);font-weight:600;}
    .pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
    .pill.Compra{background:#3d1f13;color:#ff9b6a;}
    .pill.Venta{background:#123322;color:var(--accent2);}
    .pill.Carrera{background:#1b2440;color:#7fa4ff;}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:50;}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:520px;width:92%;max-height:85vh;overflow:auto;}
    .modal h2{margin-top:0;}
    .close{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
    .empty{color:var(--muted);text-align:center;padding:40px 0;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;display:none;z-index:100;}
    .loading{text-align:center;color:var(--muted);padding:40px;}
  </style>
</head>
<body>

<header>
  <h1>🏁 Tienda <span>Assetto Corsa Evo</span></h1>
  <div class="selector">
    <span>Soy:</span>
    <select id="pilotoSelector" onchange="cambiarPilotoActivo()"></select>
    <span class="saldo" id="saldoActivo"></span>
  </div>
</header>

<nav>
  <button id="tab-tienda" class="active" onclick="mostrarTab('tienda')">Tienda</button>
  <button id="tab-pilotos" onclick="mostrarTab('pilotos')">Pilotos</button>
  <button id="tab-historial" onclick="mostrarTab('historial')">Historial</button>
</nav>

<main>
  <div id="view-tienda"><div class="loading">Cargando catálogo…</div></div>
  <div id="view-pilotos" style="display:none"><div class="loading">Cargando pilotos…</div></div>
  <div id="view-historial" style="display:none"><div class="loading">Cargando historial…</div></div>
</main>

<div class="modal-bg" id="modalFicha">
  <div class="modal">
    <span class="close" onclick="cerrarModal()">✕</span>
    <div id="fichaContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let pilotos = [];
let cochesCache = [];
let pilotoActivo = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2800);
}

function cargarInicial(){
  google.script.run.withSuccessHandler(ps => {
    pilotos = ps;
    const sel = document.getElementById('pilotoSelector');
    sel.innerHTML = ps.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
    pilotoActivo = ps[0] ? ps[0].id : null;
    actualizarSaldoActivo();
    cargarTienda();
    cargarPilotos();
    cargarHistorial();
  }).getPilotos();
}

function actualizarSaldoActivo(){
  const p = pilotos.find(x => x.id === pilotoActivo);
  document.getElementById('saldoActivo').textContent = p ? `${p.creditos.toLocaleString()} cr` : '';
}

function cambiarPilotoActivo(){
  pilotoActivo = document.getElementById('pilotoSelector').value;
  actualizarSaldoActivo();
}

function mostrarTab(tab){
  ['tienda','pilotos','historial'].forEach(t=>{
    document.getElementById('view-'+t).style.display = (t===tab)?'block':'none';
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
}

/* ---------- TIENDA ---------- */
function cargarTienda(){
  google.script.run.withSuccessHandler(coches => {
    cochesCache = coches;
    const html = coches.map(c => `
      <div class="card">
        <div class="img" style="background-image:url('${c.imagen||''}')">${c.imagen?'':'Sin imagen'}</div>
        <div class="body">
          <h3>${c.marca} ${c.modelo}</h3>
          <span class="tag">${c.categoria||''}</span>
          <div class="price">${Number(c.precio).toLocaleString()} cr</div>
          <p>${c.stock>0? c.stock+' disponibles' : 'Sin stock'}</p>
          <button class="btn" ${c.stock<=0?'disabled':''} onclick="comprar('${c.id}')">${c.stock<=0?'Sin stock':'Comprar'}</button>
        </div>
      </div>`).join('');
    document.getElementById('view-tienda').innerHTML = `<div class="grid">${html || '<div class="empty">No hay coches en la tienda</div>'}</div>`;
  }).getCatalogo();
}

function comprar(idCoche){
  if(!pilotoActivo) return;
  google.script.run
    .withSuccessHandler(res => { toast('¡Coche comprado!'); refrescarTodo(); })
    .withFailureHandler(err => toast('Error: ' + err.message))
    .comprarCoche(pilotoActivo, idCoche);
}

/* ---------- PILOTOS ---------- */
function cargarPilotos(){
  google.script.run.withSuccessHandler(ps => {
    pilotos = ps;
    actualizarSaldoActivo();
    const html = ps.map(p => `
      <div class="card" onclick="abrirFicha('${p.id}')">
        <div class="body">
          <h3>${p.nombre}</h3>
          <div class="price">${Number(p.creditos).toLocaleString()} cr</div>
          <p>${p.numCoches} coche(s) en propiedad</p>
        </div>
      </div>`).join('');
    document.getElementById('view-pilotos').innerHTML = `<div class="grid">${html}</div>`;
  }).getPilotos();
}

function abrirFicha(idPiloto){
  document.getElementById('fichaContent').innerHTML = '<div class="loading">Cargando ficha…</div>';
  document.getElementById('modalFicha').style.display = 'flex';
  google.script.run.withSuccessHandler(f => {
    const coches = f.coches.map(c => `
      <div class="card" style="cursor:default">
        <div class="img" style="background-image:url('${c.imagen||''}')">${c.imagen?'':'Sin imagen'}</div>
        <div class="body">
          <h3>${c.marca} ${c.modelo}</h3>
          <p>Comprado por ${Number(c.precioCompra).toLocaleString()} cr</p>
          <button class="btn sell" onclick="vender('${f.id}','${c.idPropiedad}')">Vender a la tienda</button>
        </div>
      </div>`).join('') || '<div class="empty">Sin coches en propiedad</div>';

    const hist = f.historial.slice(0,10).map(h => `
      <tr><td>${new Date(h.Fecha).toLocaleDateString()}</td>
      <td><span class="pill ${h.Tipo}">${h.Tipo}</span></td>
      <td>${h.Coche||''}</td>
      <td>${h.Importe>0?'+':''}${Number(h.Importe).toLocaleString()}</td></tr>`).join('');

    document.getElementById('fichaContent').innerHTML = `
      <h2>${f.nombre}</h2>
      <p class="price">${Number(f.creditos).toLocaleString()} cr disponibles</p>
      <h3>Garaje</h3>
      <div class="grid">${coches}</div>
      <h3>Últimos movimientos</h3>
      <table><tbody>${hist || '<tr><td class="empty" colspan=4>Sin movimientos</td></tr>'}</tbody></table>
    `;
  }).getFichaPiloto(idPiloto);
}

function vender(idPiloto, idPropiedad){
  google.script.run
    .withSuccessHandler(res => { toast('Coche vendido a la tienda'); cerrarModal(); refrescarTodo(); })
    .withFailureHandler(err => toast('Error: ' + err.message))
    .venderCoche(idPiloto, idPropiedad);
}

function cerrarModal(){ document.getElementById('modalFicha').style.display = 'none'; }

/* ---------- HISTORIAL ---------- */
function cargarHistorial(){
  google.script.run.withSuccessHandler(hs => {
    const rows = hs.map(h => `
      <tr>
        <td>${new Date(h.Fecha).toLocaleString()}</td>
        <td><span class="pill ${h.Tipo}">${h.Tipo}</span></td>
        <td>${h.Piloto||''}</td>
        <td>${h.Coche||''}</td>
        <td>${h.Importe>0?'+':''}${Number(h.Importe).toLocaleString()}</td>
        <td>${Number(h.Saldo_Resultante).toLocaleString()}</td>
      </tr>`).join('');
    document.getElementById('view-historial').innerHTML = `
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Piloto</th><th>Coche</th><th>Importe</th><th>Saldo</th></tr></thead>
        <tbody>${rows || '<tr><td class="empty" colspan=6>Sin movimientos todavía</td></tr>'}</tbody>
      </table>`;
  }).getHistorialCompleto();
}

function refrescarTodo(){
  cargarTienda(); cargarPilotos(); cargarHistorial();
}

cargarInicial();
</script>
</body>
</html>
